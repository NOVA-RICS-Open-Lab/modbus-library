[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32_modbus_lib"
version = "1.0.0"
description = "Python library for controlling multiple ESP32 devices via Modbus TCP"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["esp32", "modbus", "tcp", "automation", "control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pymodbus>=3.0.0",
]

[tool.setuptools.packages.find]
# Ensures the build system finds the package folder shown in your project structure
where = ["."]
include = ["esp32_Modbus*"]